services:
  gpx-blue:
    image: gpx-app:latest
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      - APK_DIR=/data/apk
    volumes:
      - gpx_data:/data
      - apk_data:/data/apk:ro

  apk-builder:
    image: gpx-apk-builder:latest
    build:
      context: ./docker/apk-builder
    profiles: ["apk"]
    restart: "no"
    environment:
      # required — build.js exits with code 2 if any is empty
      - TWA_DOMAIN=${TWA_DOMAIN:-}
      - TWA_PACKAGE_ID=${TWA_PACKAGE_ID:-}
      - TWA_KEYSTORE_PASSWORD=${TWA_KEYSTORE_PASSWORD:-}
      - TWA_KEY_PASSWORD=${TWA_KEY_PASSWORD:-}
      - TWA_KEY_ALIAS=${TWA_KEY_ALIAS:-android}
      - TWA_APP_NAME=${TWA_APP_NAME:-GPX Tools}
      - TWA_APP_NAME_SHORT=${TWA_APP_NAME_SHORT:-GPX}
      - TWA_THEME_COLOR=${TWA_THEME_COLOR:-#0e1424}
      - TWA_BG_COLOR=${TWA_BG_COLOR:-#f2e9d4}
      - TWA_APP_VERSION=${TWA_APP_VERSION:-1.0.0}
      - TWA_APP_VERSION_CODE=${TWA_APP_VERSION_CODE:-1}
      - TWA_KEY_COUNTRY=${TWA_KEY_COUNTRY:-FR}
      - TWA_SCHEME=${TWA_SCHEME:-https}
    volumes:
      - apk_data:/data/apk
      - apk_keystore:/keystore

volumes:
  gpx_data:
  apk_data:
  apk_keystore:
